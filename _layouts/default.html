<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700|Noto+Sans:400,400i,700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a href="{{ '/' | relative_url }}" class="site-header__logo">🧠 SynapSys</a>
      <nav class="site-header__nav">
        <details class="dropdown">
          <summary>Sessions</summary>
          <div class="dropdown__menu">
            {% for track in site.data.sessions %}<a href="#{{ track.id }}">{{ track.title }}</a>{% endfor %}
          </div>
        </details>
        <a href="https://www.youtube.com/@synapsyslab" target="_blank">YouTube</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>Copyright &copy; {{ site.time | date: '%Y' }} - SynapSys Reading Group</p>
      <p><a href="https://www.youtube.com/@synapsyslab" target="_blank">Watch on YouTube</a></p>
    </div>
  </footer>
  <script>
    // Close the Sessions menu after picking a section or clicking elsewhere.
    (function () {
      var menu = document.querySelector('.dropdown');
      if (!menu) return;
      menu.addEventListener('click', function (e) {
        if (e.target.closest('.dropdown__menu a')) menu.open = false;
      });
      document.addEventListener('click', function (e) {
        if (!menu.contains(e.target)) menu.open = false;
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') menu.open = false;
      });
    })();
  </script>
</body>
</html>
