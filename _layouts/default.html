<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700|Noto+Sans:400,400i,700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a href="{{ '/' | relative_url }}" class="site-header__logo">🧠 SynapSys</a>
      <nav class="site-header__nav">
        {% for track in site.data.sessions %}<a href="#{{ track.id }}">{{ track.title }}</a>{% endfor %}
        <a href="https://discord.gg/RZD4cn9Bd" target="_blank">Discord</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>Copyright &copy; {{ site.time | date: '%Y' }} - SynapSys Reading Group</p>
      <p><a href="https://discord.gg/RZD4cn9Bd" target="_blank">Join us on Discord</a></p>
    </div>
  </footer>
</body>
</html>
